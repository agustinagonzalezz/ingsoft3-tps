server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Todo lo que llegue a /api se reenvía al backend por la red interna de compose.
    # Acá SÍ vale el nombre de servicio ("backend"): nginx corre DENTRO de la red.
    # El browser nunca ve al backend: para él, front y API son el mismo origen (sin CORS).
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SPA: si la ruta no es un archivo (ej: /jugadoras), devolver index.html
    # y que React Router resuelva del lado del browser.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
