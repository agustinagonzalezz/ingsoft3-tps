# Igual que docker-compose.yml, pero usando las imágenes publicadas en GHCR
# en vez de construirlas. Sirve para levantar el sistema sin el código fuente.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tpinge3
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: tpinge3_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tpinge3"]
      interval: 5s
      retries: 10

  backend:
    image: ghcr.io/agustinagonzalezz/teampay-backend:v0.2.0
    environment:
      DATABASE_URL: "postgresql://tpinge3:${DB_PASSWORD}@postgres:5432/tpinge3_db"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 5s
      retries: 10
      start_period: 10s

  frontend:
    image: ghcr.io/agustinagonzalezz/teampay-frontend:v0.2.0
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
