name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    # Un job por componente: backend y frontend se construyen en paralelo,
    # cada uno con su propio contexto, Dockerfile y cache.
    strategy:
      fail-fast: false
      matrix:
        componente: [backend, frontend]
    name: build (${{ matrix.componente }})
    runs-on: ubuntu-latest
    # TP6: permiso para publicar en ghcr.io. Va en el job (no arriba de todo): mínimo privilegio.
    # Lo que no se lista queda sin permiso, por eso contents: read (lo necesita el checkout).
    permissions:
      contents: read
      packages: write
    steps:
      - name: Qué estamos verificando
        env:
          RAMA: ${{ github.head_ref || github.ref_name }}
        run: echo "Rama $RAMA · commit $GITHUB_SHA · componente ${{ matrix.componente }}"

      - name: Bajar el código al runner
        uses: actions/checkout@v6

      - name: Preparar el constructor que sabe cachear
        uses: docker/setup-buildx-action@v4

      # ---- TP5: tests + coverage, en el MISMO job (los required checks no cambian) ----
      # Cuatro estantes de cache: backend, frontend, backend-test y frontend-test.
      - name: Construir la etapa de tests (${{ matrix.componente }})
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.componente }}
          target: test # se detiene en la etapa test, no llega a runtime
          load: true # baja la imagen al Docker del runner para poder hacer docker run
          push: false
          tags: ${{ matrix.componente }}-test:ci
          cache-from: type=gha,scope=${{ matrix.componente }}-test
          cache-to: type=gha,mode=max,scope=${{ matrix.componente }}-test

      - name: Correr los tests con coverage (${{ matrix.componente }})
        env:
          COMPONENTE: ${{ matrix.componente }}
        # El ENTRYPOINT de la etapa corre `npm run test:ci`. COVERAGE_DIR le dice a vitest
        # dónde dejar el reporte: /out/coverage, una SUBcarpeta del volumen (vitest borra
        # esa carpeta antes de escribir, y el punto de montaje no se puede borrar).
        run: |
          mkdir -p reportes
          docker run --rm \
            -e COVERAGE_DIR=/out/coverage \
            -v "${{ github.workspace }}/reportes:/out" \
            "$COMPONENTE-test:ci"

      - name: Resumen de coverage (${{ matrix.componente }})
        if: ${{ !cancelled() }} # también si los tests fallaron: es cuando más se quiere ver
        env:
          COMPONENTE: ${{ matrix.componente }}
        run: |
          RESUMEN=reportes/coverage/coverage-summary.json
          # Sin reporte, o con un reporte que no midió nada, el paso falla: un 0/0
          # no es "todo cubierto", es que la medición no corrió.
          if [ ! -f "$RESUMEN" ]; then
            echo "::error::No se generó $RESUMEN"
            exit 1
          fi
          if ! jq -e '.total.lines.total > 0' "$RESUMEN" > /dev/null; then
            echo "::error::El reporte de coverage no midió ninguna línea"
            exit 1
          fi
          {
            echo "### Coverage · $COMPONENTE"
            echo ""
            echo "| Métrica | Cubiertas | Total | % |"
            echo "|---|---|---|---|"
            jq -r '.total as $t
              | [["Líneas","lines"],["Ramas","branches"],["Funciones","functions"],["Sentencias","statements"]][]
              | "| \(.[0]) | \($t[.[1]].covered) | \($t[.[1]].total) | \($t[.[1]].pct) % |"' "$RESUMEN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar el reporte (${{ matrix.componente }})
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: coverage-${{ matrix.componente }} # un nombre por componente: en la matriz no se pueden repetir
          path: reportes/coverage

      # ---- TP6: publicar el artefacto. Estos dos pasos son los ÚLTIMOS del job, a propósito ----
      # No llevan !cancelled() ni always(): si los tests fallaron, el job ya murió y no llegan a correr.
      - name: Entrar al registry
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # token propio de la corrida, no hace falta secret nuevo

      # El build final (el del TP4) se mudó acá abajo: antes estaba ANTES de los tests.
      # Publica sólo en un push a main (las dos condiciones, no una). En los PRs construye igual pero no sube.
      - name: Construir y publicar la imagen (${{ matrix.componente }})
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.componente }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/${{ github.repository }}-${{ matrix.componente }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.componente }}
          cache-to: type=gha,mode=max,scope=${{ matrix.componente }}

  # ==== TP6 §3.3: la promoción a QA. Arranca donde termina la verificación ====
  deploy-qa:
    name: deploy (qa)
    runs-on: ubuntu-latest
    needs: build # espera a los DOS jobs de la matriz (backend y frontend): sin CI verde no hay deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' # los PRs verifican; sólo main despliega
    environment: qa # hereda los secrets del environment qa y deja el registro en Deployments
    permissions:
      contents: read # este job no publica nada: no necesita packages: write
    steps:
      # El &ref= NO es opcional: un hook pelado despliega la PUNTA de main, no el commit que
      # este pipeline acaba de verificar. Con dos merges seguidos, la corrida del primero
      # desplegaría el segundo, que todavía no pasó por nada. Va & y no ? porque la URL del
      # hook ya trae un parámetro (?key=...).
      # Ojo: Render RECONSTRUYE ese commit desde el repo; se despliega el commit verificado,
      # no la imagen verificada. Es la brecha que cierra el TP7.
      - name: Disparar el deploy en Render (backend + front) del commit verificado
        env:
          HOOK_API: ${{ secrets.RENDER_HOOK_API_QA }}
          HOOK_FRONT: ${{ secrets.RENDER_HOOK_FRONT_QA }}
        # Antes de llamar, se revisa cada hook SIN imprimirlo: si está vacío o no tiene la forma
        # de un deploy hook, el job lo dice con nombre y motivo. GitHub enmascara los secrets en
        # el log, así que un valor mal cargado (vacío, con un espacio, otra URL) sólo se ve así.
        run: |
          disparar() {
            local nombre="$1" hook="$2"
            if [ -z "$hook" ]; then
              echo "::error::$nombre está vacío (no existe en el environment qa)"; return 1
            fi
            if [[ "$hook" =~ [[:space:]] ]]; then
              echo "::error::$nombre tiene espacios o saltos de línea (largo ${#hook})"; return 1
            fi
            if [[ "$hook" != https://api.render.com/deploy/srv-*\?key=* ]]; then
              echo "::error::$nombre no tiene la forma https://api.render.com/deploy/srv-…?key=… (largo ${#hook})"; return 1
            fi
            curl -fsS --max-time 30 -o /dev/null "$hook&ref=$GITHUB_SHA"
            echo "✅ $nombre: deploy pedido a Render para el commit $GITHUB_SHA"
          }
          disparar RENDER_HOOK_API_QA "$HOOK_API"
          disparar RENDER_HOOK_FRONT_QA "$HOOK_FRONT"

      # Reintenta 30 x 20 s (~10 min): el hook contesta al instante y Render construye en
      # segundo plano (2-5 min) + el cold start del free tier. Un curl seco daría rojo falso.
      - name: Smoke test (espera a que QA conteste con ESTE commit)
        shell: bash
        env:
          URL_API: https://teampay-api-qa.onrender.com
          URL_FRONT: https://teampay-front-qa.onrender.com
        run: |
          echo "Esperando a que QA corra el commit $GITHUB_SHA..."
          for i in $(seq 1 30); do
            # --max-time en cada curl: un servicio despertando acepta la conexión y no contesta.
            COMMIT=$(curl -fsS --max-time 10 "$URL_API/api/health" | jq -r '.commit' || true)
            if [ "$COMMIT" = "$GITHUB_SHA" ] \
               && curl -fsS --max-time 10 "$URL_API/api/jugadoras" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/api/health" > /dev/null \
               && curl -fsS --max-time 10 "$URL_FRONT/" > /dev/null; then
              echo "✅ QA responde con el commit verificado: api + base + front (y el front llega a su api)"
              exit 0
            fi
            echo "Intento $i/30: la api dice commit '${COMMIT:-sin respuesta}'. Reintento en 20 s"
            sleep 20
          done
          echo "::error::QA no respondió con el commit $GITHUB_SHA a tiempo"
          exit 1
