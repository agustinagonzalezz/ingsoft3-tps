version: 2
updates:
  - package-ecosystem: "npm"              # las dependencias del backend (Express + Prisma)
    directory: "/backend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"              # las del frontend (React + Vite)
    directory: "/frontend"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"   # las actions del pipeline también son dependencias
    directory: "/"
    schedule:
      interval: "weekly"
